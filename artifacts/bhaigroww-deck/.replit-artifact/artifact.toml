kind = "slides"
previewPath = "/bhaigroww-deck/"
title = "Bhaigroww Deck"
version = "1.0.0"
id = "artifacts/bhaigroww-deck"
router = "path"

[[services]]
name = "web"
paths = [ "/bhaigroww-deck/" ]
localPort = 22436

[services.development]
run = "pnpm --filter @workspace/bhaigroww-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bhaigroww-deck", "run", "build" ]
serve = "static"
publicDir = "artifacts/bhaigroww-deck/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22436"
BASE_PATH = "/bhaigroww-deck/"
