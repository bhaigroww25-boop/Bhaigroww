kind = "web"
previewPath = "/"
title = "Bhaigroww"
version = "1.0.0"
id = "artifacts/bhaigroww"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18840

[services.development]
run = "pnpm --filter @workspace/bhaigroww run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bhaigroww", "run", "build" ]
serve = "static"
publicDir = "artifacts/bhaigroww/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18840"
BASE_PATH = "/"
